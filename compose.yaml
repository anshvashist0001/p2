services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockroom-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: .
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: stockroom
      PGUSER: stockroom
      PGPASSWORD: ${POSTGRES_PASSWORD:-stockroom-local-only}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-before-deployment}
      DEBUG: "1"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-warehouse-demo}
    command: ["sh", "-c", "python manage.py migrate --noinput && waitress-serve --listen=0.0.0.0:8000 --threads=8 stockroom.wsgi:application"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/session', timeout=5)"]
      interval: 10s
      timeout: 8s
      start_period: 20s
      retries: 10
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
